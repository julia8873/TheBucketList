name: Release AAB/APK

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed AAB (Play Store) + APK
    runs-on: ubuntu-latest
    environment: production  # requires manual approval in GitHub Environments

    # Variables disponibles en TODOS los pasos. Es imprescindible que lleguen al paso de Gradle:
    # es ahí donde Metro empaqueta el JavaScript y donde se decide a qué Supabase apunta la app.
    # Sin ellas la build apuntaría al entorno `local`.
    env:
      APP_ENV: prod
      EXPO_PUBLIC_APP_ENV: prod
      EXPO_PUBLIC_SUPABASE_URL_PROD: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL_PROD }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY_PROD: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY_PROD }}
      EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL || 'https://thebucketlist-8zk.pages.dev' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check required secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for v in GOOGLE_SERVICES_JSON SIGNING_KEY_STORE_BASE64 SIGNING_KEY_ALIAS SIGNING_KEY_STORE_PASSWORD SIGNING_KEY_PASSWORD EXPO_PUBLIC_SUPABASE_URL_PROD EXPO_PUBLIC_SUPABASE_ANON_KEY_PROD; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secreto $v"; exit 1; fi
          done

      # Debe existir ANTES de `expo prebuild`: así app.config.js activa el plugin de Google Services
      # (si se copiase después, Gradle no aplicaría el plugin y FCM no funcionaría).
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/google-services.json

      - name: Decode upload keystore
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: echo "$SIGNING_KEY_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Expo prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Build signed AAB + APK
        working-directory: apps/mobile/android
        env:
          KS_PASS: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Verify AAB is NOT debug-signed
        run: |
          AAB=$(ls apps/mobile/android/app/build/outputs/bundle/release/*.aab | head -n1)
          echo "AAB: $AAB"
          keytool -printcert -jarfile "$AAB" | tee "$RUNNER_TEMP/cert.txt"
          if grep -qi "Android Debug" "$RUNNER_TEMP/cert.txt"; then
            echo "::error::El AAB está firmado con la clave de debug. Google Play lo rechazará."; exit 1
          fi

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "TheBucketList ${{ steps.version.outputs.VERSION }}"
          body: |
            ## What's new in ${{ steps.version.outputs.VERSION }}

            See [CHANGELOG.md](CHANGELOG.md) for details.

            ### Installation
            - **Google Play**: sube el `.aab` a la Play Console (pista interna / cerrada / producción).
            - **APK**: descárgalo e instálalo en tu dispositivo Android (activa "Instalar apps desconocidas" si lo pide).

            ### PWA
            Visit https://thebucketlist-8zk.pages.dev and install from your browser.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
